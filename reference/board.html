<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slate</title>

<!-- One JSON object per line, newest first. Sits above the styles so it can be read
     without them; one line per item so every edit is a whole line and there are no
     commas to place. -->
<script type="application/x-ndjson" id="data">
</script>

<style>
:root {
  color-scheme: light dark;
  --bg: #fcfcfb;
  --text: #16161a;
  --muted: #6c6c75;
  --faint: #a2a2aa;
  --accent: #b6600a;
  --accent-halo: rgba(182, 96, 10, 0.16);
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f0f11;
    --text: #ececef;
    --muted: #8a8a93;
    --faint: #5e5e68;
    --accent: #f0a53c;
    --accent-halo: rgba(240, 165, 60, 0.18);
  }
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 76px 32px 104px;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}

/* One text rail down the page: board title, group labels and item titles all
   start at --rail. The gutter left of it carries nothing but status markers. */
.board {
  --rail: 22px;
  max-width: 600px;
  margin: 0 auto;
}

.board-title {
  margin: 0 0 44px;
  padding-left: var(--rail);
  font-size: 22px;
  font-weight: 600;
  letter-spacing: -0.015em;
}

.group + .group { margin-top: 36px; }

.group-label {
  margin: 0 0 8px;
  padding-left: var(--rail);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.085em;
  text-transform: uppercase;
  color: var(--faint);
}

.item {
  display: grid;
  grid-template-columns: var(--rail) 1fr auto;
  align-items: start;
  padding: 9px 0;
}

/* 9px marker optically centred on the 22.5px first line of the title. */
.marker {
  width: 9px;
  height: 9px;
  margin-top: 7px;
  border-radius: 50%;
}

.idea .marker { box-shadow: inset 0 0 0 1.5px var(--faint); }

/* The accent appears here and nowhere else: colour answers "what is in flight". */
.active .marker {
  background: var(--accent);
  box-shadow: 0 0 0 4px var(--accent-halo);
}

/* The check needs more box than a dot to read at this size. The -1px pulls its
   ink back onto the dot centres, keeping one marker rail across all states. */
.done .marker {
  width: 11px;
  height: 11px;
  margin-top: 6px;
  margin-left: -1px;
  border-radius: 0;
  color: var(--faint);
}

.done .marker svg { display: block; width: 11px; height: 11px; }

.title { font-size: 15px; line-height: 1.5; }

/* Done recedes by dropping a step in the text hierarchy, never by strike-through. */
.done .title { color: var(--muted); }

.note {
  margin-top: 3px;
  font-size: 13px;
  line-height: 1.45;
  color: var(--muted);
}

.date {
  padding-left: 20px;
  font-size: 12px;
  line-height: 22.5px;
  color: var(--faint);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.more, .empty {
  padding-left: var(--rail);
  font-size: 12px;
  color: var(--faint);
}

.more { margin: 12px 0 0; }
.empty { margin: 0; }

@keyframes rise {
  from { opacity: 0; transform: translateY(5px); }
  to { opacity: 1; transform: none; }
}

.board-title, .group-label, .item {
  animation: rise 0.34s cubic-bezier(0.2, 0.65, 0.3, 1) backwards;
}

@media (prefers-reduced-motion: reduce) {
  .board-title, .group-label, .item { animation: none; }
}
</style>
</head>
<body>

<main class="board" id="board">
  <h1 class="board-title">Slate</h1>
</main>

<script>
// A malformed line drops itself rather than blanking the board. The write path is a
// line edit by a machine on a file nobody validates, so one bad line must stay local.
const items = document.getElementById('data').textContent
  .split('\n')
  .map(line => line.trim())
  .filter(Boolean)
  .flatMap(line => { try { return [JSON.parse(line)]; } catch { return []; } });

const GROUPS = [
  { status: 'active', label: 'In progress' },
  { status: 'idea', label: 'Ideas' },
  { status: 'done', label: 'Done' }
];
const DONE_SHOWN = 5;
const STAGGER = 26;
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const CHECK = '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.4 6.3 4.8 8.7 9.6 3.3"/></svg>';

// Split the ISO string by hand: new Date('2026-07-28') parses as UTC midnight
// and renders as the previous day anywhere west of Greenwich.
function formatDate(iso) {
  if (!iso) return '';
  const parts = iso.split('-');
  return Number(parts[2]) + ' ' + MONTHS[Number(parts[1]) - 1];
}

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text) node.textContent = text;
  return node;
}

function itemNode(item, delay) {
  const row = el('div', 'item ' + item.status);
  row.style.animationDelay = delay + 'ms';

  const marker = el('span', 'marker');
  if (item.status === 'done') marker.innerHTML = CHECK;
  row.append(marker);

  const body = el('div');
  body.append(el('div', 'title', item.title));
  if (item.note) body.append(el('div', 'note', item.note));
  row.append(body);

  const stamp = item.status === 'done' ? item.completed : item.created;
  row.append(el('div', 'date', formatDate(stamp)));
  return row;
}

const board = document.getElementById('board');
let delay = STAGGER;

if (!items.length) board.append(el('p', 'empty', 'Nothing on the slate.'));

for (const group of GROUPS) {
  const inGroup = items
    .filter(item => item.status === group.status)
    .sort((a, b) => String(b.completed || b.created).localeCompare(String(a.completed || a.created)));

  if (!inGroup.length) continue;

  const section = el('section', 'group');
  const label = el('p', 'group-label', group.label);
  label.style.animationDelay = delay + 'ms';
  section.append(label);
  delay += STAGGER;

  const shown = group.status === 'done' ? inGroup.slice(0, DONE_SHOWN) : inGroup;
  for (const item of shown) {
    section.append(itemNode(item, delay));
    delay += STAGGER;
  }

  const hidden = inGroup.length - shown.length;
  if (hidden) section.append(el('p', 'more', hidden + ' more completed'));

  board.append(section);
}
</script>

</body>
</html>
