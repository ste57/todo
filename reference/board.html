<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slate</title>

<style>
:root {
  color-scheme: light dark;
  --bg: #fcfcfb;
  --text: #16161a;
  --muted: #6c6c75;
  --faint: #a2a2aa;
  --accent: #5f7a52;
  --accent-halo: rgba(95, 122, 82, 0.16);
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f0f11;
    --text: #ececef;
    --muted: #8a8a93;
    --faint: #5e5e68;
    --accent: #a7c47f;
    --accent-halo: rgba(167, 196, 127, 0.16);
  }
}

@property --orb-color {
  syntax: "<color>";
  inherits: false;
  initial-value: #5f7a52;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 76px 32px 104px;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}

/* One text rail down the page: group labels and item titles all start at --rail.
   The gutter left of it carries nothing but status markers. */
.board {
  --rail: 22px;
  max-width: 600px;
  margin: 0 auto;
}

.group + .group { margin-top: 36px; }

.group-label {
  margin: 0 0 8px;
  padding-left: var(--rail);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.085em;
  text-transform: uppercase;
  color: var(--faint);
}

.item {
  display: grid;
  grid-template-columns: var(--rail) 1fr auto;
  align-items: start;
  padding: 9px 0;
}

/* 9px marker optically centred on the 22.5px first line of the title. */
.marker {
  display: block;
  position: relative;
  width: 9px;
  height: 9px;
  margin-top: 7px;
  border-radius: 50%;
}

.idea .marker { box-shadow: inset 0 0 0 1.5px var(--faint); }

/* The accent appears here and nowhere else: colour answers "what is in flight".
   It also cools. Nothing in a file can observe whether an agent is still alive, so the board
   reports age instead of liveness: --heat runs from 1 to 0 across the window below, draining
   the marker toward faint. Something that has claimed to be in progress since yesterday stops
   looking like it, without anyone having to maintain a flag. */
.active .marker {
  overflow: hidden;
  --live: color-mix(in oklab, var(--accent) calc(var(--heat, 1) * 100%), var(--faint));
  --orb-color: #5f7a52;
  --flow-duration: 30s;
  --flow-delay: 0s;
  --shine-x: 34%;
  --shine-y: 30%;
  background:
    radial-gradient(circle at var(--shine-x) var(--shine-y), color-mix(in oklab, var(--orb-color) 52%, white), transparent 62%),
    linear-gradient(145deg, transparent 10%, color-mix(in oklab, var(--orb-color) 72%, #2f3a27) 92%),
    var(--orb-color);
  animation: active-flow var(--flow-duration) ease-in-out var(--flow-delay) infinite;
}

/* Gone cold: it stops breathing too. A stalled item should not animate as though it is moving. */
.active.cold .marker { --orb-color: var(--live); animation: none; }

/* The check needs more box than a dot to read at this size. The -1px pulls its
   ink back onto the dot centres, keeping one marker rail across all states. */
.done .marker {
  width: 11px;
  height: 11px;
  margin-top: 6px;
  margin-left: -1px;
  border-radius: 0;
  color: var(--faint);
}

.done .marker svg { display: block; width: 11px; height: 11px; }

.title { font-size: 15px; line-height: 1.5; }

/* Project over date, right-aligned as one block. Two identical greys read as a collision, so
   the project takes the label weight and the date sits under it a step quieter and smaller.
   One block, two levels, rather than two things competing for the same edge. */
.meta {
  padding-left: 24px;
  text-align: right;
  white-space: nowrap;
}

.meta .project {
  display: block;
  font-size: 12px;
  font-weight: 500;
  line-height: 22.5px;
  color: var(--muted);
}

/* Done items are short and single line, so the project reads well in front of the title where
   it groups the row at a glance. In progress items wrap, and inline it indented only the first
   line, so there it stays in the meta block. */
.title .project { color: var(--faint); }
.title .project::after { content: "\00B7"; margin: 0 0.4em; }

/* Done recedes by dropping a step in the text hierarchy, never by strike-through. */
.done .title { color: var(--muted); }

.note {
  margin-top: 3px;
  font-size: 13px;
  line-height: 1.45;
  color: var(--muted);
}

.meta .date {
  display: block;
  margin-top: -2px;
  font-size: 11px;
  line-height: 1.4;
  color: var(--faint);
  font-variant-numeric: tabular-nums;
}

/* Done rows carry the project inline, so their date is alone in the block. The stacked
   treatment above is tuned to sit under a project; alone it needs the full meta line-height to
   stay on the title's first-line rail. */
/* A deadline is not meta about the row, it is the row's most urgent fact, so it steps up the
   existing text hierarchy once passed. No new colour: the accent stays spent on what is in
   flight. */
.meta .due { white-space: nowrap; }
.meta .overdue { color: var(--text); font-weight: 500; }

.meta .date:only-child {
  margin-top: 0;
  font-size: 12px;
  line-height: 22.5px;
}

.more, .empty {
  padding-left: var(--rail);
  font-size: 12px;
  color: var(--faint);
}

/* Stays in the meta role: same size, same faint. Only the cursor and a colour step on hover
   say it is a control, so the collapsed board looks exactly as it did. */
.more {
  appearance: none; -webkit-appearance: none;
  background: none; border: 0;
  /* Only the UA button font is being reset. The `font` shorthand would take font-size with it
     and, being the later rule of equal specificity, silently undo the 12px above. */
  font-family: inherit;
  font-weight: inherit;
  font-size: 12px;
  line-height: 1.5;
  display: block;
  margin: 12px 0 0;
  cursor: pointer;
  transition: color 160ms ease;
}

.more:hover { color: var(--muted); }
.more:focus-visible { outline: 1.5px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
.empty { margin: 0; }

@keyframes rise {
  from { opacity: 0; transform: translateY(5px); }
  to { opacity: 1; transform: none; }
}

@keyframes active-flow {
  0%, 100% {
    --orb-color: #5f7a52;
  }
  9% {
    --orb-color: #6f8553;
  }
  18% {
    --orb-color: #7f8650;
  }
  27% {
    --orb-color: #9a9449;
  }
  36% {
    --orb-color: #a08a58;
  }
  45% {
    --orb-color: #9b7b52;
  }
  54% {
    --orb-color: #b26f45;
  }
  63% {
    --orb-color: #8f6944;
  }
  72% {
    --orb-color: #8a6f45;
  }
  81% {
    --orb-color: #6e5f35;
  }
  90% {
    --orb-color: #748154;
  }
}

.group-label, .item {
  animation: rise 0.34s cubic-bezier(0.2, 0.65, 0.3, 1) backwards;
}

@media (prefers-reduced-motion: reduce) {
  .group-label, .item { animation: none; }
  .active .marker { animation: none; }
}
</style>
</head>
<body>

<main class="board" id="board"></main>

<script>
// Items live in .slate-data.js, not in this file. A page on file:// cannot read its own
// source, but it can go on loading script tags, and a fresh query string each time is what
// forces the read to come off disk instead of the cache. That is the whole live update.
// The leading dot keeps the data file out of Finder, leaving one icon on the Desktop.
const DATA_SRC = '.slate-data.js';
const POLL_MS = 1000;

const GROUPS = [
  { status: 'active', label: 'In progress' },
  { status: 'idea', label: 'Ideas' },
  { status: 'done', label: 'Done' }
];
const DONE_SHOWN = 50;
// Warm for the first two hours, fully drained by twenty four. Long enough that real work is
// never mislabelled, short enough that yesterday's abandoned item cannot pass for live.
const WARM_HOURS = 2;
const COLD_HOURS = 24;
const STAGGER = 26;
const CHECK = '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.4 6.3 4.8 8.7 9.6 3.3"/></svg>';

let incoming = [];
let parsed = false;
let showing = null;
const expanded = new Set();

// The data file calls these. S.end() is the last line of it, so it only runs if the whole
// file parsed: a half written or malformed file leaves the board on its last good state
// rather than blanking, and the next poll recovers it.
function S(item) { incoming.push(item); }
S.end = function () { parsed = true; };

function poll() {
  incoming = [];
  parsed = false;
  const tag = document.createElement('script');
  tag.src = DATA_SRC + '?t=' + Date.now();
  tag.onload = tag.onerror = function () {
    tag.remove();
    if (parsed) commit(incoming);
  };
  document.head.append(tag);
}

// Redraw only when the data actually differs, so a board that has not changed never
// re-animates. When it does change, the rise is the signal that something moved.
function commit(items) {
  const key = JSON.stringify(items);
  if (key === showing) return;
  showing = key;
  draw(items);
}

function startOfDay(date) {
  return new Date(date.getFullYear(), date.getMonth(), date.getDate());
}

// Date-only stamps are local dates and are split by hand: new Date('2026-07-28') parses as UTC
// midnight and lands on the previous day anywhere west of Greenwich. Timestamps carry their own
// offset, so they are parsed and then reduced to the local day they fell on.
function toLocalDay(stamp) {
  if (!stamp) return null;
  const text = String(stamp);
  if (/^\d{4}-\d{2}-\d{2}$/.test(text)) {
    const parts = text.split('-');
    return new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
  }
  const parsed = Date.parse(text);
  return isFinite(parsed) ? startOfDay(new Date(parsed)) : null;
}

// A due date runs the other way and needs its direction said, since "2d" would be ambiguous
// once a stamp can be in the future. Overdue steps up the text hierarchy rather than taking a
// colour: the accent answers what is in flight and spending it here would spend the only
// signal the board has.
function formatDue(stamp) {
  const then = toLocalDay(stamp);
  if (!then) return null;
  const days = Math.round((then - startOfDay(new Date())) / 86400000);
  if (days === 0) return 'due today';
  if (days === 1) return 'due tomorrow';
  if (days < 0) return (days === -1 ? '1 day' : -days + ' days') + ' overdue';
  if (days < 7) return 'due in ' + days + 'd';
  if (days < 31) return 'due in ' + Math.floor(days / 7) + 'w';
  return 'due in ' + Math.floor(days / 30) + 'mo';
}

// Relative, because the question a board answers is how long, not which day. Every stamp on it
// is in the past, so no direction is needed and the unit alone carries it.
function formatDate(stamp) {
  const then = toLocalDay(stamp);
  if (!then) return '';
  const days = Math.round((startOfDay(new Date()) - then) / 86400000);
  if (days <= 0) return 'today';
  if (days === 1) return 'yesterday';
  if (days < 7) return days + 'd';
  if (days < 31) return Math.floor(days / 7) + 'w';
  if (days < 365) return Math.floor(days / 30) + 'mo';
  return Math.floor(days / 365) + 'y';
}

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text) node.textContent = text;
  return node;
}

// 1 while warm, 0 once cold, linear between. No started stamp means an item predates the
// field, so it is left fully lit rather than accused of being stale.
function heat(item) {
  if (item.status !== 'active' || !item.started) return 1;
  const hours = (Date.now() - Date.parse(item.started)) / 3600000;
  if (!isFinite(hours) || hours <= WARM_HOURS) return 1;
  if (hours >= COLD_HOURS) return 0;
  return 1 - (hours - WARM_HOURS) / (COLD_HOURS - WARM_HOURS);
}

function stampFor(item) {
  if (item.status === 'done') return item.completed || item.created;
  if (item.status === 'active') return item.started || item.created;
  return item.created;
}

function itemNode(item, delay) {
  const row = el('div', 'item ' + item.status);
  row.style.animationDelay = delay + 'ms';
  row.dataset.id = item.id;

  const warmth = heat(item);
  if (item.status === 'active') {
    row.style.setProperty('--heat', warmth.toFixed(3));
    if (warmth < 0.35) row.classList.add('cold');
  }

  const marker = el('span', 'marker');
  if (item.status === 'active') {
    const duration = 24 + Math.random() * 16;
    marker.style.setProperty('--flow-duration', duration.toFixed(2) + 's');
    marker.style.setProperty('--flow-delay', (-Math.random() * duration).toFixed(2) + 's');
    marker.style.setProperty('--shine-x', (28 + Math.random() * 18).toFixed(1) + '%');
    marker.style.setProperty('--shine-y', (24 + Math.random() * 18).toFixed(1) + '%');
  }
  if (item.status === 'done') marker.innerHTML = CHECK;
  row.append(marker);

  const body = el('div');
  const title = el('div', 'title');
  if (item.project && item.status === 'done') title.append(el('span', 'project', item.project));
  title.append(document.createTextNode(item.title));
  body.append(title);
  if (item.note) body.append(el('div', 'note', item.note));
  row.append(body);

  const meta = el('div', 'meta');
  if (item.project && item.status !== 'done') meta.append(el('span', 'project', item.project));
  const due = item.status === 'done' ? null : formatDue(item.due);
  if (due) {
    const node = el('span', 'date due', due);
    if (Date.parse(item.due + 'T23:59:59') < Date.now()) node.classList.add('overdue');
    meta.append(node);
  } else {
    meta.append(el('span', 'date', formatDate(stampFor(item))));
  }

  row.append(meta);

  return row;
}

function draw(items) {
  const board = document.getElementById('board');
  board.textContent = '';
  let delay = STAGGER;

  if (!items.length) {
    board.append(el('p', 'empty', 'Nothing on the slate.'));
    return;
  }

  for (const group of GROUPS) {
    // Sorted by the stamp that matters for the state: when it finished, when it was picked up,
    // when it was raised. Active sorting by `started` floats live work to the top of the group
    // and sinks the stalled, so the order carries the same signal the fading colour does.
    const inGroup = items
      .filter(item => item.status === group.status)
      .sort((a, b) => String(stampFor(b)).localeCompare(String(stampFor(a))));

    if (!inGroup.length) continue;

    const section = el('section', 'group');
    const label = el('p', 'group-label', group.label);
    label.style.animationDelay = delay + 'ms';
    section.append(label);
    delay += STAGGER;

    const capped = group.status === 'done' && !expanded.has(group.status);
    const shown = capped ? inGroup.slice(0, DONE_SHOWN) : inGroup;
    for (const item of shown) {
      section.append(itemNode(item, delay));
      delay += STAGGER;
    }

    // Only the done group is ever capped, so only it gets a control. Without this an Ideas
    // group past DONE_SHOWN rendered a "Show fewer" button that collapsed nothing.
    const cappable = group.status === 'done';
    const hidden = inGroup.length - shown.length;
    if (cappable && (hidden || (inGroup.length > DONE_SHOWN && !capped))) {
      const more = el('button', 'more', hidden ? hidden + ' more completed' : 'Show fewer');
      more.type = 'button';
      more.addEventListener('click', () => {
        if (hidden) expanded.add(group.status); else expanded.delete(group.status);
        draw(JSON.parse(showing));
      });
      section.append(more);
    }

    board.append(section);
  }
}

poll();
setInterval(poll, POLL_MS);

// Heat and relative dates are both functions of the clock rather than the file, so nothing else
// would repaint them: without this a board left open overnight still reads "today". Updated in
// place rather than through draw(), which would clear the board and replay the staggered rise
// every five minutes, on a surface whose entire motion budget is that one animation.
setInterval(() => {
  if (!showing) return;
  const byId = new Map(JSON.parse(showing).map(item => [item.id, item]));
  for (const row of document.querySelectorAll('.item')) {
    const item = byId.get(row.dataset.id);
    if (!item) continue;

    if (item.status === 'active') {
      const warmth = heat(item);
      row.style.setProperty('--heat', warmth.toFixed(3));
      row.classList.toggle('cold', warmth < 0.35);
    }

    const date = row.querySelector('.date');
    if (!date) continue;
    const due = item.status === 'done' ? null : formatDue(item.due);
    date.textContent = due || formatDate(stampFor(item));
    if (due) date.classList.toggle('overdue', Date.parse(item.due + 'T23:59:59') < Date.now());
  }
}, 300000);
</script>

</body>
</html>
